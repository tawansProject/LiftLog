# Tests and builds the web app on every push and pull request to staging and main.
# Vercel deploys on its own (staging → staging URL, main → production); this check
# catches broken builds and failing tests before they get there.
name: Web app checks

on:
  push:
    branches: [main, staging]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    branches: [main, staging]
    paths: ['web/**', '.github/workflows/web-ci.yml']

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
